[workspace]
resolver = "2"
members = ["crates/htm-core", "crates/htm-gui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.76"
license = "MIT"
authors = ["AmiRCandy"]
repository = "https://github.com/AmiRCandy/HiddifyTunnelManager"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
thiserror = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
